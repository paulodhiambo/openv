[package]
name = "openv"
version = "0.1.0"
edition = "2024"

[dependencies]
fdt = "0.1.5"
riscv = "0.12.1"
buddy_system_allocator = "0.11.0"
spin = "0.9.8"
goblin = { version = "0.8.0", default-features = false, features = ["elf32", "elf64", "endian_fd"] }
smoltcp = { version = "0.11.0", default-features = false, features = ["proto-ipv4", "proto-ipv6", "socket-icmp", "socket-udp", "socket-tcp", "socket-raw", "medium-ethernet", "alloc"] }
bitflags = "1.3.2"


[profile.dev]
panic = "abort"
debug = true
opt-level = 0

[profile.release]
panic = "abort"
lto = true
opt-level = 3
codegen-units = 1
