name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# rust-toolchain.toml in the repo root pins the exact nightly + components.
# `rustup show` installs it automatically on the runner.

jobs:
  # ── Lint (kernel + userspace in parallel) ───────────────────────────────────
  lint:
    name: Lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: kernel
            dir: .
          - workspace: userspace
            dir: user

    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        # Reads rust-toolchain.toml; installs nightly + rust-src + clippy + targets
        run: rustup show

      - name: Restore Cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: cargo check
        run: cargo check

      - name: cargo clippy
        run: |
          cargo clippy -- \
            -D warnings \
            -A clippy::missing_safety_doc \
            -A clippy::identity_op \
            -A clippy::collapsible_if \
            -A clippy::unnecessary_cast \
            -A clippy::extra_unused_lifetimes \
            -A clippy::implicit_saturating_sub \
            -A clippy::manual_contains \
            -A clippy::manual_div_ceil \
            -A clippy::manual_is_multiple_of \
            -A clippy::manual_range_contains \
            -A clippy::needless_range_loop \
            -A clippy::not_unsafe_ptr_arg_deref \
            -A clippy::redundant_pattern_matching \
            -A clippy::result_unit_err \
            -A clippy::slow_vector_initialization \
            -A clippy::unnecessary_map_or \
            -A clippy::while_let_loop \
            -A clippy::clone_on_copy \
            -A clippy::never_loop \
            -A clippy::new_without_default \
            -A clippy::unwrap_or_default \
            -A clippy::empty_line_after_doc_comments

  # ── Build (depends on lint passing) ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        run: rustup show

      - name: Restore Cargo build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            user/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # ── Userspace ─────────────────────────────────────────────────────────
      - name: Build userspace (debug)
        working-directory: user
        run: cargo build

      - name: Build userspace (release)
        working-directory: user
        run: cargo build --release

      # ── Debug initrd (used for dev/testing artifacts) ──────────────────────
      - name: Package debug initrd
        run: |
          mkdir -p test_root/proc test_root/dev
          for bin in init sh ls cat hello producer consumer doexec forktest net-smoltcp spin vfs-server; do
            src="user/target/riscv64gc-unknown-none-elf/debug/$bin"
            if [ -f "$src" ]; then
              cp "$src" "test_root/$bin"
              echo "  copied $bin"
            else
              echo "  (skipping $bin — not found)"
            fi
          done
          echo "Hello from initrd TAR!" > test_root/dummy.txt
          cd test_root && tar -cf ../test_root.tar .
          echo "debug initrd: $(du -sh ../test_root.tar | cut -f1)"

      # ── Release initrd (used for the bootable disk image) ─────────────────
      - name: Package release initrd
        run: |
          mkdir -p test_root_rel/proc test_root_rel/dev
          for bin in init sh ls cat hello producer consumer doexec forktest net-smoltcp spin vfs-server; do
            src="user/target/riscv64gc-unknown-none-elf/release/$bin"
            if [ -f "$src" ]; then
              cp "$src" "test_root_rel/$bin"
              echo "  copied $bin"
            else
              echo "  (skipping $bin — not found)"
            fi
          done
          echo "Hello from initrd TAR!" > test_root_rel/dummy.txt
          cd test_root_rel && tar -cf ../test_root_release.tar .
          echo "release initrd: $(du -sh ../test_root_release.tar | cut -f1)"

      # ── Kernel ────────────────────────────────────────────────────────────
      - name: Build kernel (debug)
        run: cargo build

      - name: Build kernel (release)
        run: cargo build --release

      # ── Disk image (release kernel + release initrd) ───────────────────────
      - name: Build disk image
        run: |
          # Use llvm-objcopy from the installed llvm-tools-preview component
          LLVM_OBJCOPY="$(rustup which --toolchain nightly llvm-objcopy 2>/dev/null || true)"
          KERNEL=target/riscv64gc-unknown-none-elf/release/openv \
          INITRD=test_root_release.tar \
          LLVM_OBJCOPY="$LLVM_OBJCOPY" \
            bash scripts/build_image.sh

      # ── Binary size report ────────────────────────────────────────────────
      - name: Report binary sizes
        run: |
          echo "### Binary sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Binary | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY

          for f in \
            "target/riscv64gc-unknown-none-elf/debug/openv" \
            "target/riscv64gc-unknown-none-elf/release/openv" \
            "test_root.tar" \
            "test_root_release.tar" \
            "openv.img" \
            "openv.bin";
          do
            if [ -f "$f" ]; then
              sz=$(du -sh "$f" | cut -f1)
              echo "| \`$f\` | $sz |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Section breakdown (release kernel)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          LLVM_SIZE="$(rustup which --toolchain nightly llvm-size 2>/dev/null || echo 'size')"
          "$LLVM_SIZE" target/riscv64gc-unknown-none-elf/release/openv >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ── Artifacts ─────────────────────────────────────────────────────────
      - name: Upload kernel (debug)
        uses: actions/upload-artifact@v4
        with:
          name: openv-kernel-debug
          path: target/riscv64gc-unknown-none-elf/debug/openv
          if-no-files-found: error

      - name: Upload kernel (release)
        uses: actions/upload-artifact@v4
        with:
          name: openv-kernel-release
          path: target/riscv64gc-unknown-none-elf/release/openv
          if-no-files-found: error

      - name: Upload debug initrd
        uses: actions/upload-artifact@v4
        with:
          name: initrd-debug
          path: test_root.tar
          if-no-files-found: error

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: openv-disk-image
          path: |
            openv.img
            openv.bin
          if-no-files-found: error

      # ── Release bundle (push to main/master only) ─────────────────────────
      - name: Create release bundle
        if: github.event_name == 'push'
        run: |
          mkdir -p release-bundle
          # Kernel ELF (release)
          cp target/riscv64gc-unknown-none-elf/release/openv release-bundle/openv-kernel
          # Initrd archives
          cp test_root.tar         release-bundle/initrd-debug.tar
          cp test_root_release.tar release-bundle/initrd-release.tar
          # Bootable disk image
          cp openv.img             release-bundle/openv.img
          # Flat binary (for U-Boot / OpenSBI direct load), if objcopy succeeded
          [ -f openv.bin ] && cp openv.bin release-bundle/openv.bin || true
          # Build metadata
          cat > release-bundle/BUILD_INFO.txt <<EOF
          Commit : ${{ github.sha }}
          Branch : ${{ github.ref_name }}
          Date   : $(date -u)

          Image layout (openv.img, raw 64 MiB):
            Offset  1 MiB : kernel ELF
            Offset 32 MiB : release initrd

          Boot (QEMU, full image):
            qemu-system-riscv64 -machine virt -bios default -nographic \\
              -drive file=openv.img,format=raw,if=none,id=d0 \\
              -device virtio-blk-device,drive=d0

          Boot (QEMU, direct kernel):
            qemu-system-riscv64 -machine virt -bios default -nographic \\
              -kernel openv-kernel -initrd initrd-release.tar
          EOF

      - name: Upload release bundle
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: openv-${{ github.ref_name }}-${{ github.sha }}
          path: release-bundle/
          retention-days: 90

  # ── Rustdoc → GitHub Pages (push to main/master only) ───────────────────────
  docs:
    name: Rustdocs
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # OIDC token required by deploy-pages

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        run: rustup show

      - name: Restore Cargo build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # cargo doc picks up .cargo/config.toml automatically, which sets the
      # riscv64gc-unknown-none-elf target and -Z build-std=core,alloc.
      - name: Build rustdocs
        run: |
          cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "--default-theme=ayu --cfg docsrs"

      # GitHub Pages needs a root index.html; redirect to the crate entry point.
      - name: Add root redirect
        run: |
          cat > target/riscv64gc-unknown-none-elf/doc/index.html <<'EOF'
          <!doctype html>
          <html>
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=openv/index.html">
              <title>openv docs</title>
            </head>
            <body>
              <p>Redirecting to <a href="openv/index.html">openv docs</a>…</p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/riscv64gc-unknown-none-elf/doc

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
