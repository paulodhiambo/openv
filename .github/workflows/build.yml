name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:

  # ── Build everything ─────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install nightly \
            --component rust-src \
            --component llvm-tools-preview \
            --target riscv64gc-unknown-none-elf \
            --allow-downgrade
          rustup target add riscv64gc-unknown-none-elf --toolchain nightly

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            user/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'user/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build userspace
        working-directory: user
        run: cargo build

      - name: Package initrd
        run: |
          mkdir -p test_root/proc test_root/dev
          for bin in init sh ls cat hello producer consumer doexec forktest net-smoltcp; do
            src="user/target/riscv64gc-unknown-none-elf/debug/$bin"
            if [ -f "$src" ]; then
              cp "$src" "test_root/$bin"
            fi
          done
          echo "Hello from initrd TAR!" > test_root/dummy.txt
          cd test_root && tar -cf ../test_root.tar .

      - name: Build kernel (debug)
        run: cargo build

      - name: Build kernel (release)
        run: cargo build --release

      - name: Verify kernel ELF
        run: |
          file target/riscv64gc-unknown-none-elf/debug/openv
          file target/riscv64gc-unknown-none-elf/release/openv
          size target/riscv64gc-unknown-none-elf/debug/openv
          size target/riscv64gc-unknown-none-elf/release/openv

      - name: Upload kernel (debug)
        uses: actions/upload-artifact@v4
        with:
          name: openv-kernel-debug
          path: target/riscv64gc-unknown-none-elf/debug/openv

      - name: Upload kernel (release)
        uses: actions/upload-artifact@v4
        with:
          name: openv-kernel-release
          path: target/riscv64gc-unknown-none-elf/release/openv

      - name: Upload initrd
        uses: actions/upload-artifact@v4
        with:
          name: initrd
          path: test_root.tar
